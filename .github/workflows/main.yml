name: Build, Obfuscate and Deploy Next.js App

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code from cardeal repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js Application
        run: npm run build

      - name: Prepare deployment folder
        run: |
          rm -rf deployment
          mkdir deployment
          cp -R .next deployment/

      - name: Initialize Git repository in deployment folder
        run: |
          cd deployment
          git init
          git config user.name "FReptar0"
          git config user.email "fmemije00@gmail.com"
          git add .
          git commit -m "Deploy obfuscated build"

      - name: Push to Client Repository (qardeal)
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.CLIENT_REPO_TOKEN }}
          repository: FReptar0/qardeal
          branch: main
          force: true
